name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # test_*.py stub weasyprint via sys.modules before importing app.main,
      # so no native GTK/Pango/Cairo libs are needed to run the suite.
      - run: pytest -q
