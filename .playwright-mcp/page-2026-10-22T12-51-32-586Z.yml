  - main [ref=f19e17]:
    - generic [ref=f19e20]:
      - heading "Privacy Policy" [level=1] [ref=f19e21]
      - generic [ref=f19e22]: Last updated 21 August 2026
      - paragraph [ref=f19e23]:
        - strong [ref=f19e24]: ASVA is a collections assistant for shops that use TallyPrime.
        - text: It runs on the shop owner's own computer, next to their Tally, and its only job is to help the shop get its outstanding payments back. This page explains, in plain words, exactly what data ASVA touches and what it never touches. If anything here is unclear, email
        - link "almmatix@gmail.com" [ref=f19e25] [cursor=pointer]:
          - /url: mailto:almmatix@gmail.com
        - text: .
      - generic [ref=f19e26]:
        - heading "What ASVA can and cannot see on WhatsApp" [level=3] [ref=f19e27]
        - paragraph [ref=f19e28]:
          - strong [ref=f19e29]: "ASVA never sees:"
        - list [ref=f19e30]:
          - listitem [ref=f19e31]: What the shop owner types. The owner's own messages are never read.
          - listitem [ref=f19e32]: Any group chat, status, or broadcast. All ignored.
          - listitem [ref=f19e33]: Messages from anyone who is not a customer of the shop. Ignored and not saved.
        - paragraph [ref=f19e34]:
          - strong [ref=f19e35]: ASVA only acts when
          - text: a customer the shop already bills replies about a payment (for example "paid", or a payment screenshot). That is placed in the owner's Payments tab for the owner to review and confirm. Nothing is posted to Tally without the owner's confirmation.
        - paragraph [ref=f19e36]:
          - strong [ref=f19e37]: The AI only ever looks at photos of bills and payment screenshots
          - text: ", to read the amount. It never reads any text message."
      - heading "Who is responsible for the data" [level=2] [ref=f19e38]
      - paragraph [ref=f19e39]: The shop is the owner of its customer and ledger data (the data fiduciary). ASVA acts only as a processor on the shop's instructions, to send reminders and record payments the shop confirms. The shop's Tally data stays in the shop's Tally, on the shop's computer.
      - heading "What data ASVA stores, and why" [level=2] [ref=f19e40]
      - list [ref=f19e41]:
        - listitem [ref=f19e42]:
          - strong [ref=f19e43]: Customer name, number, and outstanding amount
          - text: from the shop's Tally, so ASVA knows who to remind and how much.
        - listitem [ref=f19e44]:
          - strong [ref=f19e45]: Reminders and bills sent
          - text: ", and their delivery status, so the shop has a record."
        - listitem [ref=f19e46]:
          - strong [ref=f19e47]: Payments a customer reports
          - text: (a "paid" message or screenshot) until the owner confirms or clears them.
        - listitem [ref=f19e48]:
          - text: ASVA does
          - strong [ref=f19e49]: not
          - text: store personal chats, group messages, or the content of messages from people who are not the shop's customers.
      - heading "Payment reminders and promise-to-pay" [level=2] [ref=f19e50]
      - paragraph [ref=f19e51]:
        - text: Reminders go out from the shop's own WhatsApp number, on a schedule based on each customer's credit terms. When a customer replies with a payment promise ("I will pay Friday") or says they paid, ASVA records that so the shop can follow up. A customer can reply
        - strong [ref=f19e52]: STOP
        - text: at any time to opt out of reminders; that choice is respected until the customer opts back in.
      - heading "Sharing" [level=2] [ref=f19e53]
      - paragraph [ref=f19e54]: ASVA does not sell customer data. Data is not shared with other shops or third parties, except the minimum needed to deliver a message (the WhatsApp delivery network) and to run the service securely.
      - heading "Retention and deletion" [level=2] [ref=f19e55]
      - paragraph [ref=f19e56]:
        - text: Generated bill PDFs are deleted after they are sent. A shop can ask us to delete its data at any time by emailing
        - link "almmatix@gmail.com" [ref=f19e57] [cursor=pointer]:
          - /url: mailto:almmatix@gmail.com
        - text: ; we remove the shop's clients, bills, messages, and payment records. A customer can ask the shop, or us, to remove their number.
      - heading "Security" [level=2] [ref=f19e58]
      - paragraph [ref=f19e59]: Access to shop data is restricted and scoped to each shop. The shop's WhatsApp login stays on the shop's own computer. We use industry-standard measures to protect data in transit and at rest.
      - heading "Your rights" [level=2] [ref=f19e60]
      - paragraph [ref=f19e61]:
        - text: Under India's data-protection law, a person can ask to access, correct, or delete their personal data, and can withdraw consent. Requests go to
        - link "almmatix@gmail.com" [ref=f19e62] [cursor=pointer]:
          - /url: mailto:almmatix@gmail.com
        - text: and we act on them promptly.
      - heading "Contact" [level=2] [ref=f19e63]
      - paragraph [ref=f19e64]:
        - text: ASVA is a product of Almmatix. For any privacy question or request, email
        - link "almmatix@gmail.com" [ref=f19e65] [cursor=pointer]:
          - /url: mailto:almmatix@gmail.com
        - text: .
