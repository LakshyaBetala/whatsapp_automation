      - generic [ref=f8e22]:
        - generic [ref=f8e23]:
          - heading "Plugin-free Tally spine" [level=3] [ref=f8e28]
          - paragraph [ref=f8e29]: Reads TallyPrime over its own HTTP server. Live day-book sync every few minutes. FIFO allocation, never double-counts.
        - generic [ref=f8e30]:
          - heading "Collections engine" [level=3] [ref=f8e34]
          - paragraph [ref=f8e35]: Bills and reminders from the shop's own number. One consolidated reminder per party. Tone and language profiles.
        - generic [ref=f8e36]:
          - heading "Sending safety" [level=3] [ref=f8e41]
          - paragraph [ref=f8e42]: Runs from the shop's own line. Daily caps, human pacing, quiet hours, number validation, opt-out honoured.
        - generic [ref=f8e43]:
          - heading "Owner assistant" [level=3] [ref=f8e50]
          - paragraph [ref=f8e51]: "Run your books by texting: LIST, REMIND TOP 10, snap a paper bill for AI reading, PAID, TERMS, on a separate number."
        - generic [ref=f8e52]:
          - heading "End-of-day digest" [level=3] [ref=f8e57]
          - paragraph [ref=f8e58]: "A nightly summary: sales, receipts, outstanding, and exactly who was reminded, by name, at a time you pick."
        - generic [ref=f8e59]:
          - heading "5-min onboarding" [level=3] [ref=f8e63]
          - paragraph [ref=f8e64]: One installer, no keys. Type an 8-char code, pick the Tally company, scan WhatsApp. Self-updating.
      - generic [ref=f8e65]:
        - generic [ref=f8e66]:
          - generic [ref=f8e67]: Collections intelligence
          - heading "Not just reminders. A full recovery workflow." [level=2] [ref=f8e68]
          - paragraph [ref=f8e69]: Everything below is in ASVA today, built from your real Tally data.
        - generic [ref=f8e70]:
          - generic [ref=f8e71]:
            - heading "Aging and DSO" [level=3] [ref=f8e72]
            - paragraph [ref=f8e73]: Outstanding split into 0-30, 31-60, 61-90 and 90+ day buckets, with your days-sales-outstanding and how much money is stuck, updated from every sync.
          - generic [ref=f8e74]:
            - heading "Who to chase today" [level=3] [ref=f8e75]
            - paragraph [ref=f8e76]: A ranked daily list by money at stake and days overdue, so you start with the customers who matter most, not a flat A-to-Z ledger.
          - generic [ref=f8e77]:
            - heading "Customer reliability grade" [level=3] [ref=f8e78]
            - paragraph [ref=f8e79]: Every party earns a grade, Reliable, Watch or Slow payer, built only from their real payment history, with the exact reasons shown. New parties are never graded unfairly.
          - generic [ref=f8e80]:
            - heading "Credit health, before you give more" [level=3] [ref=f8e81]
            - paragraph [ref=f8e82]: Open a customer and ASVA shows, calmly and only when it matters, how exposed you are and whether to collect before extending more credit. No pop-ups, no flags on every bill.
          - generic [ref=f8e83]:
            - heading "Cash coming in" [level=3] [ref=f8e84]
            - paragraph [ref=f8e85]: A weekly view of how much is likely to arrive, plus a monthly recovery report card that shows how much came back versus last month.
          - generic [ref=f8e86]:
            - heading "Promise to pay" [level=3] [ref=f8e87]
            - paragraph [ref=f8e88]: When a customer says they paid or gives a date, ASVA pauses chasing on its own until then, and resumes if the money does not arrive. You always see who promised what.
          - generic [ref=f8e89]:
            - heading "Partial payments, handled" [level=3] [ref=f8e90]
            - paragraph [ref=f8e91]: A part payment is allocated oldest-bill-first; the remainder stays in the reminder cadence and the next message reflects the real balance still due.
          - generic [ref=f8e92]:
            - heading "Reminder batches" [level=3] [ref=f8e93]
            - paragraph [ref=f8e94]: Group parties into batches, each with its own tone, language (English or Hinglish), send hour, optional discount line and UPI, so the right customers get the right message.
          - generic [ref=f8e95]:
            - heading "Owner-decided escalation" [level=3] [ref=f8e96]
            - paragraph [ref=f8e97]: For a customer well past due, you can send one firm, formal reminder, but only when you choose and after you see the exact words. ASVA never escalates the tone on its own.
